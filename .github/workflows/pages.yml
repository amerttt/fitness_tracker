# GitHub Pages CI/CD: the same steps as GitHub's built-in "pages-build-deployment"
# (Jekyll build → upload artifact → deploy), plus a syntax check of the JS files first.
# Settings → Pages → Source must be "GitHub Actions" for this workflow to deploy.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push cancels the queued one but never an in-progress deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JS syntax check
        run: for f in *.js; do node --check "$f"; done
      - name: Manifest is valid JSON
        run: node -e 'JSON.parse(require("fs").readFileSync("manifest.webmanifest","utf8"))'

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
